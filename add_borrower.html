{% extends "base.html" %}

{% block title %}Add Borrower | Bank Credit Exchange System{% endblock %}

{% block content %}
<section class="form-page">
    <div class="container">
        <div class="page-heading">
            <h2>Add Borrower</h2>
            <p>Store borrower details in a centralized database for better credit visibility.</p>
        </div>

        <div class="form-card large-form-card">
            <form action="{{ url_for('add_borrower') }}" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="full_name">Full Name</label>
                        <input type="text" id="full_name" name="full_name" placeholder="Enter borrower full name" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="aadhaar_number">Aadhaar Number</label>
                        <input type="text" id="aadhaar_number" name="aadhaar_number" placeholder="Enter 12-digit Aadhaar number" maxlength="12" required>
                    </div>

                    <div class="form-group">
                        <label for="pan_number">PAN Number</label>
                        <input type="text" id="pan_number" name="pan_number" placeholder="Enter PAN number" maxlength="10" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter email address">
                    </div>

                    <div class="form-group">
                        <label for="phone_number">Phone Number</label>
                        <input type="text" id="phone_number" name="phone_number" placeholder="Enter 10-digit phone number">
                    </div>

                    <div class="form-group form-group-full">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter complete address"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" placeholder="Enter city">
                    </div>

                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" id="state" name="state" placeholder="Enter state">
                    </div>

                    <div class="form-group">
                        <label for="pincode">Pincode</label>
                        <input type="text" id="pincode" name="pincode" placeholder="Enter 6-digit pincode" maxlength="6">
                    </div>

                    <div class="form-group">
                        <label for="employment_type">Employment Type</label>
                        <select id="employment_type" name="employment_type" required>
                            <option value="">Select employment type</option>
                            <option value="Salaried">Salaried</option>
                            <option value="Self-Employed">Self-Employed</option>
                            <option value="Business">Business</option>
                            <option value="Student">Student</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="annual_income">Annual Income</label>
                        <input type="number" step="0.01" id="annual_income" name="annual_income" placeholder="Enter annual income" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Borrower</button>
                    <a href="{{ url_for('view_borrowers') }}" class="btn btn-outline">View Borrowers</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
